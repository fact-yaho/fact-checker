<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 · 외교 팩트체커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/common.js"></script>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">

  <main class="min-h-screen flex flex-col items-center justify-center px-5 py-10">
    <a href="/" class="flex items-center gap-2.5 mb-7">
      <span class="grid place-items-center w-10 h-10 rounded-xl bg-brand text-white text-xl"><i class="ti ti-shield-check" aria-hidden="true"></i></span>
      <span class="font-extrabold text-ink text-xl tracking-tight">외교 팩트체커</span>
    </a>

    <div class="w-full max-w-[420px] bg-white rounded-xl2 shadow-card border border-line p-7 sm:p-8">
      <h1 class="text-xl font-extrabold text-ink">비밀번호 재설정</h1>
      <p class="mt-1 text-sm text-slate-500">가입한 이메일로 인증코드를 받아 새 비밀번호를 설정하세요.</p>

      <form id="form" class="mt-6 space-y-5" novalidate>
        <div>
          <label for="email" class="block text-sm font-bold text-ink-2 mb-1.5">이메일</label>
          <div class="flex gap-2">
            <input id="email" type="email" autocomplete="email" placeholder="가입한 이메일"
              class="flex-1 rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
            <button type="button" data-act="sendCode" class="side-btn">인증코드 발송</button>
          </div>
          <p id="msg-email" class="field-msg"></p>
        </div>

        <div>
          <label for="code" class="block text-sm font-bold text-ink-2 mb-1.5">인증코드</label>
          <input id="code" inputmode="numeric" placeholder="메일로 받은 6자리 코드"
            class="w-full rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] tnum focus:bg-white focus:border-brand transition">
          <p id="msg-code" class="field-msg"></p>
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-ink-2 mb-1.5">새 비밀번호</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="8자 이상"
            class="w-full rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
          <input id="password2" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인"
            class="w-full mt-2 rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
          <p id="msg-pw" class="field-msg"></p>
        </div>

        <button id="submit" type="submit" disabled
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-brand px-5 py-3.5 text-sm font-bold text-white hover:bg-brand-700 active:scale-[.99] transition disabled:opacity-50 disabled:cursor-not-allowed">
          비밀번호 변경
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">비밀번호가 기억나셨나요? <a href="/login" class="font-bold text-brand hover:underline">로그인</a></p>
    </div>
  </main>

  <style>
    .side-btn { flex:none; border-radius:12px; border:1px solid #CBD5E1; background:#fff; color:#334155; font-size:13px; font-weight:700; padding:0 14px; transition:all .15s ease; white-space:nowrap; }
    .side-btn:hover { border-color:#2563EB; color:#2563EB; }
    .side-btn:disabled { opacity:.5; cursor:not-allowed; }
    .field-msg { margin-top:7px; font-size:12.5px; font-weight:600; min-height:1em; }
    .field-msg.ok { color:#059669; } .field-msg.no { color:#DC2626; } .field-msg.info { color:#64748B; }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Y = window.Yaho;
      const $ = (id) => document.getElementById(id);
      if (Y.Auth.isLoggedIn) { location.replace("/mypage"); return; }

      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const setMsg = (el, kind, text) => { el.className = `field-msg ${kind}`; el.textContent = text; };

      async function postText(path, body) {
        const res = await Y.api(path, { method: "POST", body: JSON.stringify(body) });
        return { ok: res.ok, text: (await res.text()).trim() };
      }

      function checkReady() {
        const email = $("email").value.trim();
        const code = $("code").value.trim();
        const pw = $("password").value, pw2 = $("password2").value;
        const ready = emailRe.test(email) && code.length > 0 && pw.length >= 8 && pw === pw2;
        $("submit").disabled = !ready;
      }

      $("email").addEventListener("input", () => { setMsg($("msg-email"), "info", ""); checkReady(); });
      $("code").addEventListener("input", () => { setMsg($("msg-code"), "info", ""); checkReady(); });
      ["password", "password2"].forEach((id) => $(id).addEventListener("input", () => {
        const pw = $("password").value, pw2 = $("password2").value;
        if (!pw && !pw2) setMsg($("msg-pw"), "info", "");
        else if (pw.length < 8) setMsg($("msg-pw"), "no", "비밀번호는 8자 이상이어야 해요.");
        else if (pw !== pw2) setMsg($("msg-pw"), "no", "비밀번호가 일치하지 않아요.");
        else setMsg($("msg-pw"), "ok", "비밀번호가 일치해요.");
        checkReady();
      }));

      $("form").addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        if (btn.dataset.act === "sendCode") {
          const email = $("email").value.trim();
          if (!emailRe.test(email)) { setMsg($("msg-email"), "no", "올바른 이메일 형식을 입력해 주세요."); return; }
          btn.disabled = true; setMsg($("msg-code"), "info", "인증코드를 발송하는 중…");
          try {
            const { ok, text } = await postText("/api/v1/users/send-verification", { email, purpose: "reset" });
            setMsg($("msg-code"), ok ? "info" : "no", text || (ok ? "메일함에서 인증코드를 확인해 주세요." : "발송에 실패했어요."));
            if (ok) setMsg($("msg-email"), "ok", "인증코드를 보냈어요.");
          } catch { setMsg($("msg-code"), "no", "발송 중 오류가 발생했어요."); }
          finally { btn.disabled = false; }
        }
      });

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if ($("submit").disabled) return;
        const email = $("email").value.trim();
        const code = $("code").value.trim();
        const password = $("password").value;
        $("submit").disabled = true; $("submit").textContent = "변경 중…";
        try {
          const { ok, text } = await postText("/api/v1/users/reset-password", { email, code, newPassword: password });
          if (!ok) throw new Error(text || "비밀번호 재설정에 실패했어요.");
          Y.toast("비밀번호가 변경됐어요. 새 비밀번호로 로그인해 주세요.");
          setTimeout(() => { location.href = "/login"; }, 800);
        } catch (err) {
          setMsg($("msg-code"), "no", err.message || "비밀번호 재설정에 실패했어요. 인증코드를 다시 확인해 주세요.");
          $("submit").disabled = false; $("submit").textContent = "비밀번호 변경";
        }
      });
    });
  </script>
</body>
</html>
