<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 · 외교 팩트체커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/common.js"></script>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">

  <main class="min-h-screen flex flex-col items-center justify-center px-5 py-10">
    <a href="/" class="flex items-center gap-2.5 mb-7">
      <span class="grid place-items-center w-10 h-10 rounded-xl bg-brand text-white text-xl"><i class="ti ti-shield-check" aria-hidden="true"></i></span>
      <span class="font-extrabold text-ink text-xl tracking-tight">외교 팩트체커</span>
    </a>

    <div class="w-full max-w-[460px] bg-white rounded-xl2 shadow-card border border-line p-7 sm:p-8">
      <h1 class="text-xl font-extrabold text-ink">회원가입</h1>
      <p class="mt-1 text-sm text-slate-500">가입하면 검증 기록을 저장하고 다시 볼 수 있어요.</p>

      <form id="form" class="mt-6 space-y-5" novalidate>
        <div>
          <label for="email" class="block text-sm font-bold text-ink-2 mb-1.5">이메일</label>
          <div class="flex gap-2">
            <input id="email" type="email" autocomplete="email" placeholder="name@email.com"
              class="flex-1 rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
            <button type="button" data-act="checkEmail" class="side-btn">중복확인</button>
          </div>
          <p id="msg-email" class="field-msg"></p>
        </div>

        <div id="verifyBox" class="rounded-xl border border-line bg-slate-50/70 p-4 opacity-50 pointer-events-none transition">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold text-ink-2">이메일 인증</span>
            <button type="button" data-act="sendCode" class="text-xs font-bold text-brand hover:underline disabled:text-slate-300">인증코드 발송</button>
          </div>
          <div class="flex gap-2">
            <input id="code" inputmode="numeric" placeholder="인증코드 입력"
              class="flex-1 rounded-lg border border-line bg-white px-3.5 py-2.5 text-[15px] tnum focus:border-brand transition">
            <button type="button" data-act="verifyCode" class="side-btn side-btn--sm">확인</button>
          </div>
          <p id="msg-code" class="field-msg"></p>
        </div>

        <div>
          <label for="nickname" class="block text-sm font-bold text-ink-2 mb-1.5">닉네임</label>
          <div class="flex gap-2">
            <input id="nickname" autocomplete="nickname" placeholder="사용할 닉네임"
              class="flex-1 rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
            <button type="button" data-act="checkNick" class="side-btn">중복확인</button>
          </div>
          <p id="msg-nick" class="field-msg"></p>
        </div>

        <div>
          <label for="name" class="block text-sm font-bold text-ink-2 mb-1.5">이름</label>
          <input id="name" autocomplete="name" placeholder="이름"
            class="w-full rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-ink-2 mb-1.5">비밀번호</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="8자 이상"
            class="w-full rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
          <input id="password2" type="password" autocomplete="new-password" placeholder="비밀번호 확인"
            class="w-full mt-2 rounded-xl border border-line bg-slate-50/70 px-4 py-3 text-[15px] focus:bg-white focus:border-brand transition">
          <p id="msg-pw" class="field-msg"></p>
        </div>

        <button id="submit" type="submit" disabled
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-brand px-5 py-3.5 text-sm font-bold text-white hover:bg-brand-700 active:scale-[.99] transition disabled:opacity-50 disabled:cursor-not-allowed">
          회원가입
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">이미 계정이 있으신가요? <a id="loginLink" href="/login" class="font-bold text-brand hover:underline">로그인</a></p>
    </div>
  </main>

  <style>
    .side-btn { flex:none; border-radius:12px; border:1px solid #CBD5E1; background:#fff; color:#334155; font-size:13px; font-weight:700; padding:0 14px; transition:all .15s ease; white-space:nowrap; }
    .side-btn:hover { border-color:#2563EB; color:#2563EB; }
    .side-btn:disabled { opacity:.5; cursor:not-allowed; }
    .side-btn--sm { padding:0 12px; }
    .field-msg { margin-top:7px; font-size:12.5px; font-weight:600; min-height:1em; }
    .field-msg.ok { color:#059669; } .field-msg.no { color:#DC2626; } .field-msg.info { color:#64748B; }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Y = window.Yaho;
      const $ = (id) => document.getElementById(id);
      const returnUrl = new URLSearchParams(location.search).get("returnUrl") || "/";
      if (returnUrl && returnUrl !== "/") $("loginLink").href = `/login?returnUrl=${encodeURIComponent(returnUrl)}`;
      if (Y.Auth.isLoggedIn) { location.replace(returnUrl); return; }

      const state = { emailOk: false, emailVerified: false, nickOk: false };
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const setMsg = (el, kind, text) => { el.className = `field-msg ${kind}`; el.textContent = text; };

      async function postText(path, body) {
        const res = await Y.api(path, { method: "POST", body: JSON.stringify(body) });
        return { ok: res.ok, text: (await res.text()).trim() };
      }
      function refreshVerifyBox() {
        const box = $("verifyBox");
        const enabled = state.emailOk && !state.emailVerified;
        box.classList.toggle("opacity-50", !enabled && !state.emailVerified);
        box.classList.toggle("pointer-events-none", !enabled);
        if (state.emailVerified) box.classList.remove("opacity-50");
      }
      function checkReady() {
        const nameOk = $("name").value.trim().length > 0;
        const pw = $("password").value, pw2 = $("password2").value;
        const pwOk = pw.length >= 8 && pw === pw2;
        $("submit").disabled = !(state.emailOk && state.emailVerified && state.nickOk && nameOk && pwOk);
      }

      $("email").addEventListener("input", () => {
        state.emailOk = false; state.emailVerified = false;
        setMsg($("msg-email"), "info", ""); setMsg($("msg-code"), "info", "");
        $("code").value = ""; $("code").disabled = false;
        refreshVerifyBox(); checkReady();
      });
      $("nickname").addEventListener("input", () => { state.nickOk = false; setMsg($("msg-nick"), "info", ""); checkReady(); });
      ["name", "password", "password2"].forEach((id) => $(id).addEventListener("input", () => {
        const pw = $("password").value, pw2 = $("password2").value;
        if (!pw && !pw2) setMsg($("msg-pw"), "info", "");
        else if (pw.length < 8) setMsg($("msg-pw"), "no", "비밀번호는 8자 이상이어야 해요.");
        else if (pw !== pw2) setMsg($("msg-pw"), "no", "비밀번호가 일치하지 않아요.");
        else setMsg($("msg-pw"), "ok", "비밀번호가 일치해요.");
        checkReady();
      }));

      $("form").addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;

        if (act === "checkEmail") {
          const email = $("email").value.trim();
          if (!emailRe.test(email)) { setMsg($("msg-email"), "no", "올바른 이메일 형식을 입력해 주세요."); return; }
          btn.disabled = true;
          try { const { ok, text } = await postText("/api/v1/users/check-email", { email }); state.emailOk = ok; setMsg($("msg-email"), ok ? "ok" : "no", text || (ok ? "사용 가능한 이메일이에요." : "이미 사용 중인 이메일이에요.")); }
          catch { setMsg($("msg-email"), "no", "확인 중 오류가 발생했어요."); }
          finally { btn.disabled = false; refreshVerifyBox(); checkReady(); }
        }
        if (act === "sendCode") {
          const email = $("email").value.trim();
          btn.disabled = true; setMsg($("msg-code"), "info", "인증코드를 발송하는 중…");
          try { const { ok, text } = await postText("/api/v1/users/send-verification", { email }); setMsg($("msg-code"), ok ? "info" : "no", text || (ok ? "메일함에서 인증코드를 확인해 주세요." : "발송에 실패했어요.")); }
          catch { setMsg($("msg-code"), "no", "발송 중 오류가 발생했어요."); }
          finally { btn.disabled = false; }
        }
        if (act === "verifyCode") {
          const email = $("email").value.trim(), code = $("code").value.trim();
          if (!code) { setMsg($("msg-code"), "no", "인증코드를 입력해 주세요."); return; }
          btn.disabled = true;
          try { const { ok, text } = await postText("/api/v1/users/verify-code", { email, code }); state.emailVerified = ok; setMsg($("msg-code"), ok ? "ok" : "no", text || (ok ? "이메일 인증이 완료됐어요." : "인증코드가 올바르지 않아요.")); if (ok) $("code").disabled = true; }
          catch { setMsg($("msg-code"), "no", "인증 중 오류가 발생했어요."); }
          finally { btn.disabled = false; refreshVerifyBox(); checkReady(); }
        }
        if (act === "checkNick") {
          const nickname = $("nickname").value.trim();
          if (!nickname) { setMsg($("msg-nick"), "no", "닉네임을 입력해 주세요."); return; }
          btn.disabled = true;
          try { const { ok, text } = await postText("/api/v1/users/check-nickname", { nickname }); state.nickOk = ok; setMsg($("msg-nick"), ok ? "ok" : "no", text || (ok ? "사용 가능한 닉네임이에요." : "이미 사용 중인 닉네임이에요.")); }
          catch { setMsg($("msg-nick"), "no", "확인 중 오류가 발생했어요."); }
          finally { btn.disabled = false; checkReady(); }
        }
      });

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if ($("submit").disabled) return;
        $("submit").disabled = true; $("submit").textContent = "가입 중…";
        const payload = { email: $("email").value.trim(), password: $("password").value, name: $("name").value.trim(), nickname: $("nickname").value.trim() };
        try {
          const { ok, text } = await postText("/api/v1/users/signup", payload);
          if (!ok) throw new Error(text || "회원가입에 실패했어요.");
          Y.toast("회원가입이 완료됐어요. 로그인해 주세요.");
          setTimeout(() => { location.href = `/login?returnUrl=${encodeURIComponent(returnUrl)}`; }, 700);
        } catch (err) { Y.toast(err.message || "회원가입에 실패했어요.", true); $("submit").disabled = false; $("submit").textContent = "회원가입"; }
      });

      refreshVerifyBox();
    });
  </script>
</body>
</html>
