<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팩트체커 - 회원가입</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .input-with-btn {
            display: flex;
            gap: 10px;
        }

        .input-with-btn input {
            flex: 1;
        }

        .btn-inline {
            padding: 0 15px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .btn-inline:hover {
            background: #5c3a85;
        }

        .btn-inline:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .check-message {
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .check-message.success { color: #2f855a; display: block; }
        .check-message.error { color: #c53030; display: block; }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn-signup:hover {
            background: #5a6fd6;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #bbb;
            font-size: 12px;
            margin: 25px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        .social-signup {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 15px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: opacity 0.3s;
        }

        .btn-social:hover { opacity: 0.9; }
        .btn-google { background: #ffffff; color: #333; border: 1px solid #ddd; }
        .btn-kakao { background: #FEE500; color: #191919; border: none; }
        .btn-social img { width: 20px; height: 20px; object-fit: contain; }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .footer-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-links a:hover { text-decoration: underline; }

        .global-error {
            color: #e53e3e;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .global-success {
            color: #2f855a;
            background: #f0fff4;
            border: 1px solid #c6f6d5;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 회원가입</h1>
        <p>팩트체커 플랫폼의 회원이 되어 보세요!</p>
    </div>

    <div id="globalError" class="global-error"></div>
    <div id="globalSuccess" class="global-success"></div>

    <form id="signupForm">
        <div class="form-group">
            <label for="email">이메일 주소</label>
            <div class="input-with-btn">
                <input type="email" id="email" required placeholder="example@email.com">
                <button type="button" id="btnSendCode" class="btn-inline">인증코드 발송</button>
            </div>
            <div id="emailMessage" class="check-message"></div>
        </div>

        <div class="form-group" id="verificationGroup" style="display:none;">
            <label for="verificationCode">인증코드 입력</label>
            <div class="input-with-btn">
                <input type="text" id="verificationCode" placeholder="6자리 코드 입력">
                <button type="button" id="btnVerifyCode" class="btn-inline">인증 확인</button>
            </div>
            <div id="verificationMessage" class="check-message"></div>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" required placeholder="영문, 숫자 포함 8자 이상">
            <div id="passwordMessage" class="check-message"></div>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" required placeholder="실명을 입력하세요">
        </div>

        <div class="form-group">
            <label for="nickname">닉네임</label>
            <div class="input-with-btn">
                <input type="text" id="nickname" required placeholder="활동할 닉네임">
                <button type="button" id="btnCheckNickname" class="btn-inline">중복 확인</button>
            </div>
            <div id="nicknameMessage" class="check-message"></div>
        </div>

        <button type="submit" class="btn-signup">가입하기</button>
    </form>

    <div class="divider">또는 소셜 계정으로 회원가입</div>

    <div class="social-signup">
        <a href="/oauth2/authorization/google" class="btn-social btn-google">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
            Google로 가입하기
        </a>

    </div>

    <div class="footer-links">
        이미 계정이 있으신가요? <a href="/login">로그인</a>
    </div>
</div>

<script>
    // 상태 플래그들
    let isEmailVerified = false;
    let isNicknameChecked = false;

    const signupForm = document.getElementById('signupForm');
    const errorMessage = document.getElementById('globalError');
    const successMessage = document.getElementById('globalSuccess');

    const emailInput = document.getElementById('email');
    const btnSendCode = document.getElementById('btnSendCode');
    const emailMessage = document.getElementById('emailMessage');

    const verificationGroup = document.getElementById('verificationGroup');
    const verificationCodeInput = document.getElementById('verificationCode');
    const btnVerifyCode = document.getElementById('btnVerifyCode');
    const verificationMessage = document.getElementById('verificationMessage');

    const nicknameInput = document.getElementById('nickname');
    const btnCheckNickname = document.getElementById('btnCheckNickname');
    const nicknameMessage = document.getElementById('nicknameMessage');

    // 1. 이메일 인증 코드 발송
    btnSendCode.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) {
            showErrorMessage('emailMessage', '이메일을 입력해 주세요.');
            return;
        }

        try {
            btnSendCode.disabled = true;
            btnSendCode.textContent = '보내는 중...';

            const response = await fetch(`/api/v1/users/signup/email-verification?email=${encodeURIComponent(email)}`, {
                method: 'POST'
            });

            if (response.ok) {
                showSuccessMessage('emailMessage', '인증 코드가 이메일로 발송되었습니다.');
                verificationGroup.style.display = 'block';
            } else {
                const errorText = await response.text();
                showErrorMessage('emailMessage', errorText || '인증 코드 발송에 실패했습니다.');
                btnSendCode.disabled = false;
                btnSendCode.textContent = '인증코드 발송';
            }
        } catch (error) {
            showErrorMessage('emailMessage', '서버 통신 오류가 발생했습니다.');
            btnSendCode.disabled = false;
            btnSendCode.textContent = '인증코드 발송';
        }
    });

    // 2. 이메일 인증 코드 확인 (검증)
    btnVerifyCode.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const code = verificationCodeInput.value.trim();

        if (!code) {
            showErrorMessage('verificationMessage', '인증 코드를 입력해 주세요.');
            return;
        }

        try {
            const response = await fetch(`/api/v1/users/signup/email-verification/verify?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`, {
                method: 'POST'
            });

            if (response.ok) {
                showSuccessMessage('verificationMessage', '이메일 인증이 완려되었습니다!');
                isEmailVerified = true;
                emailInput.disabled = true;
                verificationCodeInput.disabled = true;
                btnSendCode.disabled = true;
                btnVerifyCode.disabled = true;
            } else {
                const errorText = await response.text();
                showErrorMessage('verificationMessage', errorText || '인증 코드가 올바르지 않습니다.');
            }
        } catch (error) {
            showErrorMessage('verificationMessage', '서버 통신 오류가 발생했습니다.');
        }
    });

    // 3. 닉네임 중복 확인
    btnCheckNickname.addEventListener('click', async () => {
        const nickname = nicknameInput.value.trim();
        if (!nickname) {
            showErrorMessage('nicknameMessage', '닉네임을 입력해 주세요.');
            return;
        }

        try {
            const response = await fetch(`/api/v1/users/signup/check-nickname?nickname=${encodeURIComponent(nickname)}`);
            if (response.ok) {
                showSuccessMessage('nicknameMessage', '사용 가능한 닉네임입니다.');
                isNicknameChecked = true;
            } else {
                const errorText = await response.text();
                showErrorMessage('nicknameMessage', errorText || '이미 사용 중인 닉네임입니다.');
                isNicknameChecked = false;
            }
        } catch (error) {
            showErrorMessage('nicknameMessage', '서버 통신 오류가 발생했습니다.');
        }
    });

    // 닉네임 값 변경 시 중복 체크 재유도
    nicknameInput.addEventListener('input', () => {
        isNicknameChecked = false;
        nicknameMessage.textContent = '';
        nicknameMessage.className = 'check-message';
    });

    // 4. 최종 가입 요청 폼 제출
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!isEmailVerified) {
            showError('이메일 인증을 완료해 주세요.');
            return;
        }

        if (!isNicknameChecked) {
            showError('닉네임 중복 확인을 완료해 주세요.');
            return;
        }

        const email = emailInput.value.trim();
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value.trim();
        const nickname = nicknameInput.value.trim();

        if (password.length < 8) {
            showError('비밀번호는 8자 이상이어야 합니다.');
            return;
        }

        try {
            const response = await fetch('/api/v1/users/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name, nickname })
            });

            const errorText = await response.text();

            if (response.ok) {
                showSuccess('회원가입이 축하합니다! 잠시 후 로그인 페이지로 이동합니다.');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                try {
                    const errorJson = JSON.parse(errorText);
                    showError(errorJson.message || '회원가입에 실패했습니다.');
                } catch (p) {
                    showError(errorText || '회원가입에 실패했습니다.');
                }
            }
        } catch (error) {
            showError('서버 연결 오류가 !.');
        }
    });

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        window.scrollTo(0, 0);
        setTimeout(() => {
            errorMessage.style.display = 'none';
        }, 5000);
    }

    function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.style.display = 'block';
        errorMessage.style.display = 'none';
        window.scrollTo(0, 0);
    }

    function showErrorMessage(elementId, message) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.className = 'check-message error';
    }

    function showSuccessMessage(elementId, message) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.className = 'check-message success';
    }
</script>
</body>
</html>
