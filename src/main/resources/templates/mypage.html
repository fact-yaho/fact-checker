<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팩트체커 - 마이페이지</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 50px; display: flex; justify-content: center; }
        .profile-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .profile-group { margin-bottom: 20px; }
        .profile-group label { font-weight: bold; color: #666; display: block; margin-bottom: 5px; }
        .profile-group div { font-size: 18px; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .logout-btn { width: 100%; padding: 10px; background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .withdraw-btn { width: 100%; padding: 10px; background: #ccc; color: #333; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>마이페이지 👤</h2>
    <hr style="margin-bottom: 20px;">

    <div class="profile-group">
        <label>이메일</label>
        <div id="my-email">로딩 중...</div>
    </div>
    <div class="profile-group">
        <label>이름</label>
        <div id="my-name">로딩 중...</div>
    </div>
    <div class="profile-group">
        <label>닉네임</label>
        <div id="my-nickname">로딩 중...</div>
    </div>

    <button class="logout-btn" onclick="logout()">로그아웃</button>
    <button class="withdraw-btn" onclick="withdrawAccount()">회원 탈퇴</button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        // 🎯 1. [추가] 구글 로그인 성공 후 주소창에 들어온 token 파라미터가 있는지 먼저 확인합니다.
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');

        // 🎯 2. [추가] 만약 주소창에 토큰이 있다면, 로컬 스토리지에 저장하고 주소창을 깔끔하게 비웁니다.
        if (tokenFromUrl) {
            localStorage.setItem('token', tokenFromUrl);
            // 브라우저 주소창에서 '?token=...' 부분을 지우고 원래의 '/mypage' 주소만 남깁니다.
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // 3. 로컬 스토리지에서 최종 토큰 꺼내기
        const token = localStorage.getItem('token');

        // 토큰이 없으면 로그인 페이지로 튕겨내기
        if (!token) {
            alert("로그인이 필요한 페이지입니다.");
            window.location.href = '/login';
            return;
        }

        try {
            // 4. 백엔드 마이프로필 API 호출
            const response = await fetch('/api/v1/users/me', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const user = await response.json();
                // 5. 화면에 유저 정보 바인딩
                document.getElementById('my-email').textContent = user.email;
                document.getElementById('my-name').textContent = user.name;
                document.getElementById('my-nickname').textContent = user.nickname;
            } else {
                alert("인증이 만료되었습니다. 다시 로그인해 주세요.");
                localStorage.removeItem('token');
                window.location.href = '/login';
            }
        } catch (error) {
            console.error("프로필 로딩 에러:", error);
            alert("서버 연결 오류가 발생했습니다.");
        }
    });

    // 1. 로그아웃 처리 함수
    function logout() {
        localStorage.removeItem('token');
        alert("로그아웃 되었습니다.");
        window.location.href = '/login';
    }

    // 2. 회원 탈퇴 처리 함수
    async function withdrawAccount() {
        const confirmWithdraw = confirm("정말로 탈퇴하시겠습니까?\n탈퇴 시 모든 정보가 복구 불가능하게 삭제됩니다.");
        if (!confirmWithdraw) return;

        const token = localStorage.getItem('token');
        if (!token) {
            alert("로그인 정보가 없습니다.");
            window.location.href = '/login';
            return;
        }

        try {
            const response = await fetch('/api/v1/users', {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                alert("회원 탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.");
                localStorage.removeItem('token');
                window.location.href = '/login';
            } else {
                const errorText = await response.text();
                alert("탈퇴 처리 중 오류가 발생했습니다: " + errorText);
            }
        } catch (error) {
            console.error("탈퇴 요청 에러:", error);
            alert("서버 연결 오류가 발생했습니다.");
        }
    }
</script>
</body>
</html>
