<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 · 외교 팩트체커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/common.js"></script>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">

  <header id="nav" class="bg-white border-b border-line sticky top-0 z-40"></header>

  <main class="mx-auto max-w-[560px] px-5 py-10 sm:py-12">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-ink mb-6">마이페이지</h1>

    <section class="bg-white rounded-xl2 shadow-card border border-line overflow-hidden">
      <div class="p-6 sm:p-7 flex items-center gap-4 border-b border-line">
        <div id="avatar" class="grid place-items-center w-16 h-16 rounded-2xl bg-brand-50 text-brand text-2xl font-extrabold">·</div>
        <div class="min-w-0">
          <p id="p-nickname" class="text-lg font-extrabold text-ink truncate">불러오는 중…</p>
          <p id="p-email" class="text-sm text-slate-500 truncate">—</p>
        </div>
      </div>
      <dl class="divide-y divide-line">
        <div class="flex items-center justify-between px-6 sm:px-7 py-4"><dt class="text-sm font-semibold text-slate-400">이메일</dt><dd id="d-email" class="text-sm font-bold text-ink-2">—</dd></div>
        <div class="flex items-center justify-between px-6 sm:px-7 py-4"><dt class="text-sm font-semibold text-slate-400">이름</dt><dd id="d-name" class="text-sm font-bold text-ink-2">—</dd></div>
        <div class="flex items-center justify-between px-6 sm:px-7 py-4"><dt class="text-sm font-semibold text-slate-400">닉네임</dt><dd id="d-nickname" class="text-sm font-bold text-ink-2">—</dd></div>
      </dl>
    </section>

    <div class="mt-5 grid gap-3">
      <a href="/history" class="flex items-center justify-between rounded-xl2 bg-white border border-line shadow-card px-5 py-4 hover:border-brand/60 transition group">
        <span class="flex items-center gap-3"><span class="grid place-items-center w-9 h-9 rounded-lg bg-brand-50 text-brand text-lg"><i class="ti ti-folder" aria-hidden="true"></i></span><span class="text-sm font-bold text-ink">내 검증 기록 보기</span></span>
        <i class="ti ti-chevron-right text-slate-300 group-hover:text-brand transition text-lg" aria-hidden="true"></i>
      </a>
      <button type="button" id="logoutBtn" class="rounded-xl2 bg-white border border-line shadow-card px-5 py-4 text-sm font-bold text-ink-2 hover:border-slate-300 transition text-left inline-flex items-center gap-3">
        <span class="grid place-items-center w-9 h-9 rounded-lg bg-slate-100 text-slate-500 text-lg"><i class="ti ti-logout" aria-hidden="true"></i></span> 로그아웃
      </button>
    </div>

    <div class="mt-8 pt-6 border-t border-line">
      <button type="button" id="withdrawBtn" class="text-sm font-semibold text-red-500 hover:text-red-600 hover:underline transition">회원 탈퇴</button>
      <p class="mt-1.5 text-xs text-slate-400">탈퇴하면 계정과 검증 기록이 모두 삭제되며 복구할 수 없어요.</p>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 z-50 hidden" style="background:rgba(22,34,58,.5);backdrop-filter:blur(3px)">
    <div class="min-h-full flex items-center justify-center p-5">
      <div class="w-full max-w-sm bg-white rounded-xl2 shadow-pop p-6">
        <p class="text-lg font-extrabold text-ink">정말 탈퇴하시겠어요?</p>
        <p class="mt-2 text-sm text-slate-500 leading-relaxed">계정과 모든 검증 기록이 영구적으로 삭제됩니다. 이 작업은 되돌릴 수 없어요.</p>
        <div class="mt-6 flex gap-2">
          <button type="button" id="cancelWithdraw" class="flex-1 rounded-xl bg-slate-100 px-4 py-3 text-sm font-bold text-ink hover:bg-slate-200 transition">취소</button>
          <button type="button" id="confirmWithdraw" class="flex-1 rounded-xl bg-red-600 px-4 py-3 text-sm font-bold text-white hover:bg-red-700 transition disabled:opacity-60">탈퇴하기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Y = window.Yaho;
      const $ = (id) => document.getElementById(id);
      Y.Auth.captureUrlToken();
      Y.renderNav(null);
      if (!Y.Auth.requireLogin("/mypage")) return;

      (async () => {
        try {
          const me = await Y.apiJson("/api/v1/users/me");
          $("p-nickname").textContent = me.nickname || me.name || "사용자";
          $("p-email").textContent = me.email || "";
          $("d-email").textContent = me.email || "—";
          $("d-name").textContent = me.name || "—";
          $("d-nickname").textContent = me.nickname || "—";
          const seed = (me.nickname || me.name || "?").trim();
          $("avatar").textContent = seed ? seed[0].toUpperCase() : "·";
        } catch (err) {
          if (err.status === 401 || err.status === 403) { Y.Auth.clear(); location.href = `/login?returnUrl=${encodeURIComponent("/mypage")}`; return; }
          Y.toast(err.message || "정보를 불러오지 못했어요.", true);
        }
      })();

      $("logoutBtn").addEventListener("click", () => Y.Auth.logout());

      const modal = $("modal");
      const close = () => modal.classList.add("hidden");
      $("withdrawBtn").addEventListener("click", () => modal.classList.remove("hidden"));
      $("cancelWithdraw").addEventListener("click", close);
      modal.addEventListener("click", (e) => { if (e.target === modal) close(); });
      $("confirmWithdraw").addEventListener("click", async (e) => {
        e.target.disabled = true; e.target.textContent = "처리 중…";
        try {
          const res = await Y.api("/api/v1/users", { method: "DELETE" });
          if (!res.ok) throw new Error(await Y.safeMessage(res));
          Y.Auth.clear();
          Y.toast("탈퇴가 완료됐어요. 이용해 주셔서 감사합니다.");
          setTimeout(() => (location.href = "/"), 800);
        } catch (err) { close(); Y.toast(err.message || "탈퇴 처리 중 오류가 발생했어요.", true); e.target.disabled = false; e.target.textContent = "탈퇴하기"; }
      });
    });
  </script>
</body>
</html>
